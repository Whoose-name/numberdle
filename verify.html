<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Security Token Verification</title>

    <link rel="stylesheet" href="style.css?v=20260806-02">

</head>

<body>

    <!-- Matrix Background -->
    <canvas id="matrix"></canvas>

    <!-- CRT Scanlines -->
    <div class="scanlines"></div>

    <!-- Main Container -->

    <div class="verify-container">

        <div class="verify-card">

            <h1 class="glitch"
                data-text="SECURITY TOKEN VERIFICATION">

                SECURITY TOKEN VERIFICATION

            </h1>

            <p class="verify-subtitle">

                Enter Temporary Access Token

            </p>

            <div class="verify-box">

                <label for="codeInput">

                    TEMPORARY ACCESS TOKEN

                </label>

                <input
                    type="text"
                    id="codeInput"
                    maxlength="6"
                    autocomplete="off"
                    placeholder="XXXXXX">

                <button id="verifyBtn">

                    VERIFY TOKEN

                </button>

            </div>

            <p id="verifyMessage">

                Awaiting cryptographic verification...

            </p>

        </div>

    </div>

    <!-- Loading Overlay -->

    <div id="loadingOverlay"
         class="overlay hidden">

        <div class="overlay-card">

            <h2>

                TOKEN VERIFIED

            </h2>

            <div class="loader"></div>

            <p id="loadingText">

                Launching decryption protocol...

            </p>

        </div>

    </div>

    <!-- Error Overlay -->

    <div id="errorOverlay"
         class="overlay hidden">

        <div class="overlay-card">

            <h2
                style="color:#ff3b3b">

                TOKEN REJECTED

            </h2>

            <p>

                Security mismatch detected.

            </p>

            <button id="tryAgainBtn">

                RETRY VERIFICATION

            </button>

        </div>

    </div>

    <script src="script.js?v=20260806-02"></script>

</body>

</html>
